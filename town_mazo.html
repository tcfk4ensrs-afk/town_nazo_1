<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>街の謎解き - Town Mazo</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #fefefe, #e6f7ff);
      color: #333;
    }
    header {
      background-color: #4db8ff;
      color: white;
      text-align: center;
      padding: 2rem 1rem;
    }
    header h1 {
      margin: 0;
      font-size: 2.2rem;
    }
    header p {
      margin-top: 0.5rem;
      font-size: 1.1rem;
    }
    main {
      padding: 2rem 1rem;
      max-width: 800px;
      margin: auto;
    }
    .intro {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 1.5rem;
      text-align: center;
    }
    .intro h2 {
      color: #4db8ff;
      margin-bottom: 1rem;
    }
    .intro p {
      line-height: 1.6;
      font-size: 1rem;
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #666;
    }
    /* スマホ対応 */
    @media (max-width: 600px) {
      header h1 {
        font-size: 1.8rem;
      }
      .intro h2 {
        font-size: 1.4rem;
      }
      .intro p {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>街の謎解き</h1>
    <p>ようこそ、謎解きの世界へ！</p>
  </header>
  <main>
    <section class="intro">
      <h2>概要</h2>
      <p>
        このサイトでは、街を舞台にした謎解きゲームを楽しむことができます。<br>
        ヒントを集め、頭を使って謎を解き明かし、物語を進めていきましょう。<br>
        初めての方でも気軽に挑戦できるように工夫しています。
      </p>
    </section>
  </main>
  <footer>
    &copy; 2025 Chapondice
  </footer>
</body>
</html>
