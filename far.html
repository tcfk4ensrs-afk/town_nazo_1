<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fail - Town Mazo</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #fff5f5, #ffe6e6);
      color: #333;
    }
    header {
      background-color: #cc0000;
      color: white;
      text-align: center;
      padding: 1.5rem 1rem;
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
    }
    main {
      padding: 2rem 1rem;
      max-width: 800px;
      margin: auto;
      text-align: center;
    }
    .message {
      margin: 1.5rem 0;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 1.5rem;
    }
    .message h2 {
      color: #cc0000;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      background: #cc0000;
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s, transform 0.2s;
    }
    .btn:hover {
      background: #990000;
      transform: scale(1.05);
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>失敗…</h1>
  </header>
  <main>
    <div class="message">
      <h2>残念！</h2>
      <p>答えは間違っていました。もう一度挑戦してみましょう。</p>
      <a href="Nazo1.html" class="btn">再挑戦する</a>
    </div>
  </main>
  <footer>
    &copy; 2025 Chapondice
  </footer>
