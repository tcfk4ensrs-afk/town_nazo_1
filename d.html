<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nazo1 - Town Mazo</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #fefefe, #e6f7ff);
      color: #333;
    }
    header {
      background-color: #4db8ff;
      color: white;
      text-align: center;
      padding: 1.5rem 1rem;
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
    }
    main {
      padding: 2rem 1rem;
      max-width: 800px;
      margin: auto;
      text-align: center;
    }
    .puzzle-image {
      margin: 1.5rem 0;
    }
    .puzzle-image img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>謎5</h1>
  </header>
  <main>
    <p>交点!!!!</p>
    
    <!-- 写真を表示する部分 -->
    <div class="puzzle-image">
      <img src="images/Temple.jpg" alt="謎の写真">
    </div>
    
    <p>写真なんてないです。</p>
  </main>
  <footer>
    &copy; 2025 Chapondice
  </footer>
</body>
</html>
